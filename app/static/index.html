<!doctype html><html><head><meta charset="utf-8"><title>PDF Excel Extractor</title><style>body{font-family:Arial;max-width:900px;margin:40px auto;padding:0 20px}button{padding:10px 18px;margin:8px 0}pre{background:#f4f4f4;padding:16px;white-space:pre-wrap}.row{margin:16px 0}</style></head><body><h1>PDF Excel Extractor</h1><p>Dynamic multi-page pipeline: page analysis → classification → grouping → FORM extraction → validation → Excel.</p><div class="row"><input id="file" type="file" accept="application/pdf"><button onclick="upload()">Upload & Process</button></div><pre id="out">Ready.</pre><script>let id='';async function upload(){const f=document.getElementById('file').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);document.getElementById('out').textContent='Processing...';const r=await fetch('/api/v1/documents',{method:'POST',body:fd});const j=await r.json();id=j.document_id||'';document.getElementById('out').textContent=JSON.stringify(j,null,2)+(id?'\n\nResult: /api/v1/documents/'+id+'/result\nExcel: /api/v1/documents/'+id+'/export':'');}</script></body></html>
